[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling", "uv-dynamic-versioning" ]

[project]
name = "gppt"
description = "Get your Pixiv token (for running upbit/pixivpy)"
readme = "README.md"
keywords = [
  "api",
  "pixiv",
  "token",
]
license = "MIT"
authors = [ { name = "eggplants", email = "w10776e8w@yahoo.co.jp" } ]
requires-python = ">=3.10,<4"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Typing :: Typed",
]
dynamic = [ "version" ]
dependencies = [
  "install-playwright>=0.1.1",
  "playwright>=1.57",
  "pyotp>=2.9,<3",
  "requests>=2.32.3,<3",
]
urls.Repository = "https://github.com/eggplants/get-pixivpy-token"
scripts.gppt = "gppt.cli:main"

[dependency-groups]
dev = [
  "pymarkdownlnt>=0.9.33",
  "pyproject-fmt>=2.11.1",
  "pytest>=9.0.2",
  "pytest-cov>=7",
]
docs = [
  "pdoc>=16",
]

[tool.hatch]
version.source = "uv-dynamic-versioning"
build.targets.wheel.include = [ "gppt" ]
build.targets.sdist.include = [ "gppt" ]

[tool.uv]
python-downloads = "never"
default-groups = [
  "dev",
  "docs",
]
exclude-newer = "P7D"
preview = true

[tool.ruff]
line-length = 120
format.indent-style = "space"
format.quote-style = "double"
lint.select = [ "ALL" ]
lint.ignore = [ "COM812" ]
lint.per-file-ignores."gppt/api.py" = [
  "PLR0913", # Too many arguments -- they are optional keyword-only knobs
]
lint.per-file-ignores."gppt/cli.py" = [
  "T201", # `print` found
]
lint.per-file-ignores."tests/*.py" = [
  "ANN401",  # Dynamically typed expressions (`typing.Any`) disallowed
  "D",
  "PLR2004", # Magic value used in comparison
  "S101",    # Use of `assert` detected
  "S105",    # Possible hardcoded password assigned to a variable
  "S106",    # Possible hardcoded password assigned to an argument
  "S107",    # Possible hardcoded password assigned to a function default
]
lint.pydocstyle.convention = "google"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "semver"
fallback-version = "0.0.0"
